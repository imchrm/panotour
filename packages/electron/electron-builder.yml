appId: com.panotour.editor
productName: Panotour Editor
directories:
  output: dist
files:
  - "*.js"
  - package.json
  - from: ../editor/dist
    to: renderer
win:
  target: portable
extraFiles:
  - from: stage/tiler
    to: tiler
  - from: ../viewer
    to: viewer
    filter:
      - "**/*"
      - "!tour.json"
