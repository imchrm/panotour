<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Panotour Editor</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #1e1e1e;
      color: #ddd;
    }
    .status { text-align: center; }
    code { color: #8bc34a; }
  </style>
</head>
<body>
  <div class="status">
    <h1>Panotour Editor</h1>
    <p>electronApi: <code id="api-status">unavailable</code></p>
  </div>
  <script>
    if (window.electronApi && window.electronApi.ping() === 'pong') {
      document.getElementById('api-status').textContent = 'pong';
    }
  </script>
</body>
</html>
